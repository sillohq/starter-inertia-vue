[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "starter"
version = "0.1.0"
description = "Sillo + Inertia.js + React starter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sillo-framework[cache,hashing-bcrypt,record]>=0.1.0b1",
    "sillo-inertia>=0.0.1a4",
    "email-validator>=2.0.0",
    # The SQLite driver. Swap for asyncpg or asyncmy when you change DATABASE_URL.
    "aiosqlite>=0.19.0",
]

# No [templating] extra, and no Jinja anywhere. The only HTML this project
# serves is root.html, which the Inertia adapter reads and substitutes into
# directly — every other page is React. Installing a template engine to render
# one file would be a dependency you never call.

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "httpx>=0.28.1",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# Migrations are written by the migration engine, not by you.
extend-exclude = ["database/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
